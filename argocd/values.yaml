# Values of Argo CD in the namespace argocd, installed by bootstrap.js
# from the chart argo/argo-cd. No ingress: the UI is reached through
# kubectl port-forward. Sign-in with Entra comes later; until then every
# operator has a personal account, whose password set-password.js sets.

# The address of the UI through the port-forward. Without it the chart
# assumes https://argocd.example.com, and the browser drops the session
# cookie on plain http.
global:
  domain: localhost:8080

configs:
  cm:
    url: http://localhost:8080
    # Built-in admin off; every operator signs in with a personal account
    admin.enabled: false
    accounts.ben: login
    exec.enabled: false
    statusbadge.enabled: false
  rbac:
    policy.default: ""
    policy.csv: |
      g, ben, role:admin
  params:
    # TLS ends at the port-forward
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

repoServer:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 512Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
