# One application per file in stages/: the namespaces, quotas, network
# policies and the gateway of that stage
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: stages
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://github.com/rljson/cars-deployment.git
        revision: main
        files:
          - path: stages/*.yaml
  template:
    metadata:
      name: 'stage-{{ .stage }}'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/rljson/cars-deployment.git
        targetRevision: main
        path: charts/stage
        helm:
          valueFiles: ['../../{{ .path.path }}/{{ .path.filename }}']
      destination:
        server: https://kubernetes.default.svc
        namespace: cars-gateway
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 5
          backoff: { duration: 30s }
