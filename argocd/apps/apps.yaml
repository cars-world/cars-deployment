# One application per file in values/, twelve in all: the chart of its
# service, in the namespace of its side and stage
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://github.com/cars-world/cars-deployment.git
        revision: main
        files:
          - path: values/*.yaml
  template:
    metadata:
      name: '{{ .side }}-{{ .service }}-{{ .stage }}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://github.com/cars-world/cars-deployment.git
        targetRevision: main
        path: 'charts/{{ .service }}'
        helm:
          valueFiles: ['../../{{ .path.path }}/{{ .path.filename }}']
      destination:
        server: https://kubernetes.default.svc
        namespace: 'cars-{{ .side }}-{{ .stage }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 5
          backoff: { duration: 30s }
