# https://<host>/<side>-<service>/… reaches this service without the
# prefix; /<side>-<service> without the slash is redirected to it, so the
# relative URLs of a page resolve below the prefix.
{{- $prefix := printf "/%s" (include "app.name" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: cars-{{ .Values.stage }}
      namespace: {{ .Values.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ include "app.host" . }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ $prefix }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $prefix }}/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: {{ $prefix }}/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ .Chart.Name }}
          port: 80
