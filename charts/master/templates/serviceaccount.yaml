# The service account of the master, federated with its managed identity
# id-cars-<side>-master-<stage>; the workload identity webhook gives the
# pods of this account a token of that identity.
{{- if .Values.data.clientId }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.data.clientId | quote }}
{{- end }}
