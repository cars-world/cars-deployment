# Defaults of the chart master. Each values file in values/ sets side,
# stage and image.tag, and may add env.

# origin or custom; selects the image, the namespace and the node pool
side: ""
# dev, test or prod; selects the namespace and the gateway
stage: ""

image:
  registry: crcars.azurecr.io
  # Default: cars-<side>-master
  repository: ""
  tag: ""

# The free Azure name of the gateway of a stage:
# cars-<stage>.<region>.cloudapp.azure.com
region: germanywestcentral

# The gateway of each stage lives in this namespace
gatewayNamespace: cars-gateway

replicas: 1
port: 3000
healthPath: /health
readOnlyRootFilesystem: true

# Extra environment variables of the container
env: {}

# The data of the master on Azure: its own SQL database and blob container
# in rg-cars, reached through the managed identity
# id-cars-<side>-master-<stage>. With clientId set, the pod runs as the
# service account master, federated with that identity, and gets the
# variables CARS_SQL_SERVER, CARS_SQL_DATABASE, CARS_BLOB_URL and
# CARS_BLOB_CONTAINER; without it, the master has no Azure data.
data:
  # Client ID of id-cars-<side>-master-<stage>; not a secret
  clientId: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
