# https://<host>/… reaches the client; /api goes to the master by the
# longer prefix of its route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "app.gateway" . }}
      namespace: {{ .Values.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ include "app.host" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Chart.Name }}
          port: 80
