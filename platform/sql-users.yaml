# Creates the database user of each master in its own database: a
# contained user of its managed identity, member of db_owner of that
# database only. The SQL servers allow Entra sign-in only and no public
# access, so the job runs inside the cluster as the Entra admin
# id-cars-sql-admin (cars-infra, components data-identities and sql),
# through the workload identity of the service account sql-users.
#
# The user is created WITH SID = the client ID of the identity, TYPE = E,
# which needs no lookup in Microsoft Graph. The job is idempotent and runs
# after every sync of the application platform.
apiVersion: v1
kind: Namespace
metadata:
  name: cars-data
  labels:
    app.kubernetes.io/part-of: cars
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sql-users
  namespace: cars-data
  annotations:
    # Client ID of id-cars-sql-admin; not a secret
    azure.workload.identity/client-id: ee2f7763-8314-4bd0-a2ce-1624d9227744
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-users
  namespace: cars-data
data:
  # One entry per master: its database and the client ID of its identity
  users.json: |
    [
      { "side": "origin", "stage": "dev", "clientId": "41f761f5-b53f-47fb-a69f-7b7eaef39336" },
      { "side": "origin", "stage": "test", "clientId": "aa33007c-71ef-47ba-85f1-e69f5c0db473" },
      { "side": "origin", "stage": "prod", "clientId": "ffbb1952-d15e-4e99-8f47-746d783c5f11" },
      { "side": "custom", "stage": "dev", "clientId": "00b08bbc-d940-4a9a-a508-ec95892f9834" },
      { "side": "custom", "stage": "test", "clientId": "6ab380b5-0d60-4bca-98ea-c899d629d733" },
      { "side": "custom", "stage": "prod", "clientId": "3ab2ce7b-1e45-4930-9912-57844b329cc7" }
    ]
  sql-users.mjs: |
    import { readFileSync } from 'node:fs';
    import sql from 'mssql';

    const users = JSON.parse(readFileSync('/config/users.json', 'utf8'));
    const sides = ['origin', 'custom'];
    const stages = ['dev', 'test', 'prod'];
    const guid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

    let failed = 0;
    for (const { side, stage, clientId } of users) {
      // Only known names and a GUID reach the statement below
      if (!sides.includes(side) || !stages.includes(stage) || !guid.test(clientId)) {
        throw new Error(`Invalid entry: ${side} ${stage} ${clientId}`);
      }
      const user = `id-cars-${side}-master-${stage}`;
      const database = `sqldb-cars-${side}-${stage}`;
      const pool = new sql.ConnectionPool({
        server: `sql-cars-${side}.database.windows.net`,
        database,
        options: { encrypt: true },
        authentication: { type: 'azure-active-directory-default', options: {} },
      });
      try {
        await pool.connect();
        await pool.request().batch(`
          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'${user}')
          BEGIN
            DECLARE @sid NVARCHAR(100) = CONVERT(NVARCHAR(100),
              CAST(CAST('${clientId}' AS UNIQUEIDENTIFIER) AS VARBINARY(16)), 1);
            EXEC(N'CREATE USER [${user}] WITH SID = ' + @sid + N', TYPE = E');
          END;
          IF IS_ROLEMEMBER('db_owner', N'${user}') = 0
            ALTER ROLE db_owner ADD MEMBER [${user}];
        `);
        console.log(`✅ ${database}: ${user} is db_owner`);
      } catch (e) {
        failed++;
        console.error(`❌ ${database}: ${e.message}`);
      } finally {
        await pool.close();
      }
    }
    process.exit(failed ? 1 : 0);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sql-users
  namespace: cars-data
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sql-users
        app.kubernetes.io/part-of: cars
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sql-users
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sql-users
          image: node:22-alpine
          workingDir: /work
          command: [sh, -c]
          args:
            - >-
              cp /config/sql-users.mjs . &&
              npm install --no-audit --no-fund --loglevel=error mssql@11.0.1 &&
              node sql-users.mjs
          env:
            - name: HOME
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: config, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: work
          emptyDir: {}
        - name: config
          configMap:
            name: sql-users
